name: MATLAB cloud verification

on:
  push:
    branches: [work]
  workflow_dispatch:

jobs:
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MATLAB and Signal Processing Toolbox
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
      - name: Verify MATLAB functions
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); verify_matlab_cloud"
      - name: Reproduce current dual-direction prototype
        uses: matlab-actions/run-command@v3
        with:
          command: "mkdir('results/baseline'); diary('results/baseline/prototype.log'); run('demo_direct_wvd_signed_amb_temporal_triplets.m'); diary('off')"
      - name: Evaluate soft two-direction fusion
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); evaluate_fusion"
      - name: Download official CWRU outer-race fault record
        run: |
          mkdir -p input/cwru
          curl -LfsS --retry 3 -o input/cwru/130.mat https://engineering.case.edu/sites/default/files/130.mat
          echo '35a095307d0971477049b343a1b5981dde465a58fb7f233ad89b035068c1717d  input/cwru/130.mat' | sha256sum -c -
      - name: Inspect CWRU WVD frequency candidates
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); probe_cwru"
      - name: Save verification logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-results
          path: results/
          if-no-files-found: warn
