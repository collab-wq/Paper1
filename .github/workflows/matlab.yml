name: MATLAB cloud verification

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/matlab.yml
      - main_Paper1.m
      - matlab/verify_matlab_cloud.m
      - matlab/validate_cwru.m
      - matlab/run_synthetic_batch.m
      - matlab/run_cwru_batch.m
      - scripts/download_cwru.sh
  workflow_dispatch:

jobs:
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install MATLAB and Signal Processing Toolbox
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
      - name: Verify MATLAB functions
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); verify_matlab_cloud"
      - name: Download official CWRU first batch
        run: bash scripts/download_cwru.sh
      - name: Validate CWRU MAT records and metadata
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); validate_cwru"
      - name: Run synthetic experiment
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); run_synthetic_batch"
      - name: Run five CWRU fault-signal segments
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); run_cwru_batch"
      - name: Save verification logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-results
          path: results/
          if-no-files-found: warn
