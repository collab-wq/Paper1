name: Paper1 full real bearing validation
on:
  push:
    branches: [experiment/full-real-bearing-validation]
    paths:
      - '.github/workflows/full-real-bearing-validation.yml'
      - 'scripts/download_cwru.sh'
      - 'scripts/download_paderborn.sh'
      - 'scripts/download_ottawa.sh'
      - 'scripts/download_xjtu.py'
      - 'scripts/preflight_data.py'
      - 'matlab/verify_adaptive_band_selection.m'
      - 'main_Paper1.m'
      - 'run_adaptive_order_candidates.m'
      - 'fault_evidence_order.m'
      - 'estimate_encoder_phase.m'
      - 'matlab/run_*_batch.m'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); verify_adaptive_band_selection"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-real-self-check
          path: results/adaptive-self-check/
  data-preflight:
    needs: self-check
    strategy:
      fail-fast: false
      matrix:
        dataset: [cwru, paderborn, ottawa, xjtu]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install archive reader
        if: matrix.dataset == 'paderborn'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar
      - name: Inspect XJTU central directory
        if: matrix.dataset == 'xjtu'
        run: |
          mkdir -p results/preflight/xjtu
          for bearing in Bearing1_2 Bearing1_3 Bearing2_1 Bearing2_2 Bearing3_1 Bearing3_4; do
            python scripts/download_xjtu.py --bearing "$bearing" | tee -a results/preflight/xjtu/directory.log
          done
      - name: Download specified records
        if: matrix.dataset != 'xjtu'
        run: |
          case '${{ matrix.dataset }}' in
            cwru) bash scripts/download_cwru.sh ;;
            paderborn) bash scripts/download_paderborn.sh ;;
            ottawa) bash scripts/download_ottawa.sh ;;
          esac
      - name: Inspect MAT metadata and channels
        if: matrix.dataset != 'xjtu'
        run: |
          python -m pip install --quiet scipy numpy
          python scripts/preflight_data.py '${{ matrix.dataset }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ matrix.dataset }}
          path: |
            results/preflight/${{ matrix.dataset }}/
            input/${{ matrix.dataset }}/source_manifest.csv
          if-no-files-found: warn
  trial:
    needs: data-preflight
    strategy:
      fail-fast: false
      matrix:
        dataset: [cwru, paderborn, ottawa, xjtu]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install archive reader
        if: matrix.dataset == 'paderborn'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar
      - name: Download trial source
        run: |
          case '${{ matrix.dataset }}' in
            cwru) bash scripts/download_cwru.sh ;;
            paderborn) bash scripts/download_paderborn.sh ;;
            ottawa) bash scripts/download_ottawa.sh ;;
            xjtu) python scripts/download_xjtu.py --bearing Bearing1_2 --snapshot 1 --fetch ;;
          esac
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
      - name: Run one adaptive real-data segment
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('matlab');
            if strcmp('${{ matrix.dataset }}','cwru'),
              main_Paper1('cwru','input/cwru/105.mat',1);
            elseif strcmp('${{ matrix.dataset }}','paderborn'),
              main_Paper1('paderborn','input/paderborn/KA04/N15_M07_F10_KA04_1.mat',64001);
            elseif strcmp('${{ matrix.dataset }}','ottawa'),
              main_Paper1('ottawa','input/ottawa/I-A-2.mat',1);
            else,
              main_Paper1('xjtu','input/xjtu-sy/35Hz12kN/Bearing1_2/1.csv',4097);
            end
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-${{ matrix.dataset }}
          path: |
            results/adaptive-band-selection/
            results/input_segments/
          retention-days: 90
          if-no-files-found: warn
