name: Paper1 absolute support multiband experiment

on:
  push:
    branches: [experiment/absolute-support-multiband]
    paths:
      - .github/workflows/absolute-support-multiband.yml
      - main_Paper1.m
      - dual_detector_abs_multiband.m
      - band_union.m
      - select_resonance_bands.m
      - matlab/verify_abs_support_multiband.m
      - matlab/run_multiband_validation.m
      - matlab/run_*_batch.m
      - scripts/summarize_multiband.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
      - name: Verify absolute support and all band combinations without real data
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); verify_abs_support_multiband; run_synthetic_batch(2)"
      - name: Archive independent self-check and synthetic regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absolute-support-multiband-self-check
          path: results/absolute-support-multiband/
          if-no-files-found: warn

  real-data-validation:
    needs: self-check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        dataset: [cwru, paderborn, xjtu]
        R: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install official Paderborn archive reader
        if: matrix.dataset == 'paderborn'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar
      - name: Fetch and verify only the selected dataset
        run: |
          case '${{ matrix.dataset }}' in
            cwru) bash scripts/download_cwru.sh ;;
            paderborn) bash scripts/download_paderborn.sh ;;
            xjtu) python scripts/download_xjtu.py --fetch ;;
          esac
      - uses: matlab-actions/setup-matlab@v3
        with:
          products: Signal_Processing_Toolbox
      - name: Run fixed segments at one band count
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('matlab'); run_multiband_validation('${{ matrix.dataset }}',${{ matrix.R }})"
      - name: Archive images, arrays, logs, and per-segment status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiband-${{ matrix.dataset }}-R${{ matrix.R }}
          path: results/absolute-support-multiband/
          if-no-files-found: warn

  aggregate:
    needs: [self-check, real-data-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: multiband-*
          merge-multiple: true
          path: collected
      - name: Build one 105-row experiment table
        run: python scripts/summarize_multiband.py collected MULTIBAND_RESULTS.csv
      - name: Commit branch-only result table
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MULTIBAND_RESULTS.csv
          git commit -m 'Record absolute support multiband validation [skip ci]'
          git pull --rebase origin experiment/absolute-support-multiband
          git push origin HEAD:experiment/absolute-support-multiband
      - uses: actions/upload-artifact@v4
        with:
          name: multiband-combined-table
          path: MULTIBAND_RESULTS.csv
