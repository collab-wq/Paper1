name: Publish Paper1 multiband representative figures

on:
  push:
    branches: [experiment/absolute-support-multiband]
    paths: [.github/workflows/publish-multiband-figures.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: multiband-cwru-R4
          run-id: 43607357936
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: collected/cwru
      - uses: actions/download-artifact@v4
        with:
          name: multiband-paderborn-R2
          run-id: 43607357936
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: collected/paderborn
      - uses: actions/download-artifact@v4
        with:
          name: multiband-xjtu-R3
          run-id: 43607357936
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: collected/xjtu
      - name: Publish three verified eight-panel pairs
        run: |
          mkdir -p figures/absolute-support-multiband
          cp collected/cwru/cwru-130/R4/paper_figure.png figures/absolute-support-multiband/cwru-130-R4.png
          cp collected/cwru/cwru-130/R4/paper_figure.pdf figures/absolute-support-multiband/cwru-130-R4.pdf
          cp collected/paderborn/paderborn/N15_M07_F10_KA04_3-start128001/R2/paper_figure.png figures/absolute-support-multiband/paderborn-ka04-R2.png
          cp collected/paderborn/paderborn/N15_M07_F10_KA04_3-start128001/R2/paper_figure.pdf figures/absolute-support-multiband/paderborn-ka04-R2.pdf
          cp collected/xjtu/xjtu/Bearing1_1-123-start4097/R3/paper_figure.png figures/absolute-support-multiband/xjtu-bearing1_1-late-R3.png
          cp collected/xjtu/xjtu/Bearing1_1-123-start4097/R3/paper_figure.pdf figures/absolute-support-multiband/xjtu-bearing1_1-late-R3.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/absolute-support-multiband
          git commit -m 'Publish multiband representative figures [skip ci]'
          git pull --rebase origin experiment/absolute-support-multiband
          git push origin HEAD:experiment/absolute-support-multiband
      - uses: actions/upload-artifact@v4
        with:
          name: multiband-representative-figures
          path: figures/absolute-support-multiband/
