name: Discover official bearing data

on:
  push:
    branches: [work]
    paths:
      - .github/workflows/discover-data.yml
  workflow_dispatch:

jobs:
  paderborn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch official Paderborn documentation and file index
        run: |
          python - <<'PY'
          import html, html.parser, re, urllib.request
          base='https://mb.uni-paderborn.de/en/kat/research/bearing-datacenter/'
          urls={
             'datasets':base+'data-sets-and-download',
             'conditions':base+'operating-conditions',
             'damage':base+'bearing-damage',
             'rig':base+'test-rig-and-measurement-equipment',
             'files':'https://groups.uni-paderborn.de/kat/BearingDataCenter/',
          }
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.href=None; self.label=''
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.href=dict(attrs).get('href'); self.label=''
              def handle_data(self,data):
                  if self.href: self.label+=data.strip()+' '
              def handle_endtag(self,tag):
                  if tag=='a' and self.href:
                      self.links.append((self.label.strip(),self.href)); self.href=None
          for name,url in urls.items():
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  body=response.read().decode('utf-8','replace')
                  print('PAGE_STATUS',name,response.status,'URL',response.url,'BYTES',len(body))
              open('/tmp/paderborn-'+name+'.html','w').write(body)
              clean=re.sub(r'<(script|style)[^>]*>.*?</\1>',' ',body,flags=re.I|re.S)
              clean=html.unescape(re.sub(r'<[^>]+>',' ',clean))
              clean=re.sub(r'\s+',' ',clean)
              print('TEXT',name,clean[-18000:])
              p=Links(); p.feed(body)
              for label,href in p.links:
                  if name=='files' or any(x in (label+' '+href).lower() for x in ['download','bearing','data','damage','pdf','.zip','ka0','ki0']):
                      print('LINK',name,repr(label[:100]),href)
            except Exception as exc:
              print('PAGE_ERROR',name,repr(exc))
          PY
      - name: Read official study tables and archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils p7zip-full
          curl -LfsS --retry 3 -o /tmp/paderborn-study.pdf https://mb.uni-paderborn.de/fileadmin-mb/kat/PDF/Veroeffentlichungen/20160703_PHME16_CM_bearing.pdf
          pdftotext -layout /tmp/paderborn-study.pdf /tmp/paderborn-study.txt
          rg -n -i -C 12 'Table 5|Table 6|Table 4|KA04|KA15|KI04|KI14|sampling|64 kHz|64,000|accelerat' /tmp/paderborn-study.txt | head -320
          command -v 7z || true
          command -v bsdtar || true
          command -v unrar || true
          curl -LfsS https://groups.uni-paderborn.de/kat/BearingDataCenter/readme_versions.txt
          for bearing in K001 KA04 KI04; do
            curl -sI "https://groups.uni-paderborn.de/kat/BearingDataCenter/${bearing}.rar" | rg -i 'HTTP/|content-length|last-modified|accept-ranges' || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paderborn-official-page
          path: /tmp/paderborn-*.html
          if-no-files-found: ignore
